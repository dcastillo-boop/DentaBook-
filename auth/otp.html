<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Phone — DentaBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/pages/otp.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">

      <a href="../index.html" class="navbar__logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3C8 3 6 5 6 8c0 2 1 3 1 5s-1 4-1 6 1 4 3 4 2-2 2-3 0-3 2-3 2 2 2 3 1 3 3 3 3-2 3-4-1-4-1-6 1-3 1-5c0-3-2-5-5-5-1 0-2 .5-2 .5S13 3 12 3z"/>
        </svg>
        DentaBook
      </a>

      <div class="navbar__actions">
        <a href="login.html" class="btn btn--ghost">Cancel</a>
      </div>

    </div>
  </header>

  <main>
    <section class="otp-wrap">
      <div class="otp-card">

        <div class="otp-card__icon"></div>

        <h1>Verify Your Phone</h1>
        <p>
          We sent a 6-digit code to
          <strong id="phoneDisplay">your phone</strong>.
        </p>

        <!-- Demo OTP banner (Milestone 1 only) -->
        <div class="otp-demo">
          <strong>Demo mode:</strong> Your OTP is
          <code id="demoCode">------</code>
        </div>

        <form id="otpForm" novalidate>
          <div class="otp-inputs" id="otpInputs">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>

          <button type="submit" class="btn btn--primary btn--block btn--lg">
            Verify
          </button>
        </form>

        <p class="resend-line">
          Didn't get the code?
          <a href="#" id="resendLink" class="is-disabled">
            Resend in <span id="countdown">30</span>s
          </a>
        </p>

        <p class="text-muted text-sm mt-2 mb-0">
          You must verify your phone before you can book an appointment.
        </p>

      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/pages/auth-otp.js"></script>

</body>
</html>
