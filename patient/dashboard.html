<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointments — DentaBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/pages/patient-dashboard.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">

      <a href="../index.html" class="navbar__logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3C8 3 6 5 6 8c0 2 1 3 1 5s-1 4-1 6 1 4 3 4 2-2 2-3 0-3 2-3 2 2 2 3 1 3 3 3 3-2 3-4-1-4-1-6 1-3 1-5c0-3-2-5-5-5-1 0-2 .5-2 .5S13 3 12 3z"/>
        </svg>
        DentaBook
      </a>

      <nav>
        <ul class="navbar__links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../public/services.html">Services</a></li>
          <li><a href="../public/clinics.html">Clinics</a></li>
          <li><a href="dashboard.html" class="is-active">My Appointments</a></li>
        </ul>
      </nav>

      <div class="navbar__actions">
        <a href="../auth/login.html" class="btn btn--ghost btn--sm">Log In</a>
        <a href="../public/services.html" class="btn btn--primary btn--sm">Book Now</a>
        <button class="navbar__toggle" id="navToggle" aria-label="Toggle navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6"  x2="21" y2="6"  />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

    </div>
  </header>

  <main>

    <!-- ============================================================
         DASHBOARD HEADER + STATS
         ============================================================ -->
    <section class="dash-header">
      <div class="container">
        <div class="dash-header__row">
          <div>
            <h1 id="welcomeText">Hello, [Patient Name]!</h1>
            <p class="text-muted">Here's what's happening with your dental appointments.</p>
          </div>
          <a href="../public/services.html" class="btn btn--primary">+ Book New Appointment</a>
        </div>

        <div class="stats" id="statsRow"></div>
      </div>
    </section>

    <!-- ============================================================
         TABS + APPOINTMENT LIST
         ============================================================ -->
    <section class="section section--flush-top section--compact">
      <div class="container">
        <div class="tabs" id="tabsRow"></div>
        <div id="apptList"></div>
      </div>
    </section>

  </main>

  <script src="../js/main.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/pages/patient-dashboard.js"></script>

</body>
</html>
