<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard — DentaBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/staff.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="../index.html" class="navbar__logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3C8 3 6 5 6 8c0 2 1 3 1 5s-1 4-1 6 1 4 3 4 2-2 2-3 0-3 2-3 2 2 2 3 1 3 3 3 3-2 3-4-1-4-1-6 1-3 1-5c0-3-2-5-5-5-1 0-2 .5-2 .5S13 3 12 3z"/></svg>
        DentaBook
      </a>
      <div class="navbar__actions"></div>
    </div>
  </header>

  <div class="staff-shell">
    <aside class="staff-sidebar">
      <div class="staff-sidebar__clinic">
        <strong id="clinicName">Clinic</strong>
        <span id="staffRole">Role</span>
      </div>

      <div class="staff-sidebar__header">Manage</div>
      <ul class="staff-nav">
        <li><a href="dashboard.html" class="is-active"> Dashboard</a></li>
        <li><a href="appointments.html"> Appointments</a></li>
        <li><a href="calendar.html"> Calendar</a></li>
      </ul>

      <div class="staff-sidebar__header">Clinic Setup</div>
      <ul class="staff-nav">
        <li><a href="dentists.html"> Dentists</a></li>
        <li><a href="services.html"> Services</a></li>
      </ul>

      <div class="staff-sidebar__header">System</div>
      <ul class="staff-nav">
        <li><a href="sms-log.html"> SMS Log</a></li>
      </ul>
    </aside>

    <main class="staff-main">

      <div class="staff-header">
        <div>
          <h1 id="welcomeText">Welcome</h1>
          <p id="todayText"></p>
        </div>
        <a href="appointments.html" class="btn btn--primary">View All Appointments</a>
      </div>

      <div class="staff-stats" id="statsRow"></div>

      <section class="staff-card">
        <div class="staff-card__head">
          <h2>⏳ Pending Approvals</h2>
          <span class="text-muted text-sm" id="pendingCount"></span>
        </div>
        <div class="staff-table-wrap">
          <table class="staff-table">
            <thead>
              <tr>
                <th>Ref</th>
                <th>Patient</th>
                <th>Service</th>
                <th>Schedule</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pendingBody"></tbody>
          </table>
        </div>
      </section>

      <section class="staff-card">
        <div class="staff-card__head">
          <h2> Today's Appointments</h2>
        </div>
        <div class="staff-table-wrap">
          <table class="staff-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Patient</th>
                <th>Service</th>
                <th>Dentist</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="todayBody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/pages/staff-dashboard.js"></script>

</body>
</html>
